<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Documentación – ComercioLocal</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentación oficial y guías técnicas de la plataforma ComercioLocal.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Estilos del tema de Docsify (Sleek Dark/Light Modern) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- Tipografía Outfit de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --theme-color: #25883f; /* Verde ComercioLocal */
      --text-color: #334155;
      --heading-color: #0f172a;
    }
    
    body {
      font-family: 'Outfit', sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }

    .sidebar {
      background-color: #f8fafc !important;
      border-right: 1px solid #e2e8f0 !important;
    }

    .sidebar-nav li a {
      font-size: 0.92rem !important;
      font-weight: 500;
      color: #64748b !important;
      border-radius: 8px;
      padding: 6px 12px !important;
      margin: 4px 10px !important;
      transition: all 0.15s ease;
    }

    .sidebar-nav li a:hover {
      background-color: #f1f5f9 !important;
      color: var(--theme-color) !important;
      text-decoration: none !important;
    }

    .sidebar-nav li.active > a {
      background-color: rgba(37, 136, 63, 0.08) !important;
      color: var(--theme-color) !important;
      font-weight: 600 !important;
      border-left: none !important;
    }

    .markdown-section {
      max-width: 840px !important;
      padding: 40px 15px !important;
    }

    .markdown-section h1, 
    .markdown-section h2, 
    .markdown-section h3, 
    .markdown-section h4 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: var(--heading-color);
    }

    .markdown-section code {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
      font-family: Consolas, Monaco, monospace !important;
      border-radius: 4px;
      padding: 3px 6px !important;
      font-size: 0.88em !important;
    }

    .markdown-section pre {
      background-color: #0f172a !important;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid #1e293b;
    }

    .markdown-section pre code {
      background-color: transparent !important;
      color: #f8fafc !important;
      font-size: 0.88em !important;
    }

    /* Estilo premium de alertas tipo GitHub */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color) !important;
      background-color: #f8fafc !important;
      color: #475569 !important;
      border-radius: 0 8px 8px 0;
      padding: 12px 20px !important;
      margin: 20px 0 !important;
    }

    /* Buscador premium */
    .search input {
      background-color: #fff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 30px !important;
      padding: 8px 16px 8px 36px !important;
      font-family: 'Outfit', sans-serif !important;
      font-size: 0.85rem !important;
      outline: none !important;
      transition: all 0.2s ease;
    }

    .search input:focus {
      border-color: var(--theme-color) !important;
      box-shadow: 0 0 0 3px rgba(37, 136, 63, 0.15) !important;
    }
  </style>
</head>
<body>
  <div id="app">Cargando la documentación técnica...</div>
  <script>
    window.$docsify = {
      name: 'ComercioLocal',
      repo: 'JhonatanC4STRO/localstore-native',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar en la documentación...',
        noData: 'No se encontraron resultados',
        depth: 6
      },
      copyCode: {
        buttonText : 'Copiar',
        errorText  : 'Error',
        successText: 'Copiado'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins de Docsify adicionales para una experiencia premium -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Soporte para coloreado de sintaxis PHP y SQL -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
